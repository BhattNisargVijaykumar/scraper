name: Emma Mason CSV Scraper

on:
  workflow_dispatch:

jobs:
  scrape:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run scraper
        run: |
          cd emma_mason
          python emma_mason.py

      - name: Upload output
        uses: actions/upload-artifact@v4
        with:
          name: emma-mason-output
          path: emma_mason/media/output/
