name: Resolve Redirect URLs (MySQL)

on:
  workflow_dispatch:
    inputs:
      chunk_size:
        description: "Number of records to process per chunk"
        required: false
        default: "500"
        type: string
      max_workers:
        description: "Concurrent HTTP worker threads"
        required: false
        default: "15"
        type: string
      limit:
        description: "Max total records to process (leave blank for all)"
        required: false
        default: ""
        type: string

permissions:
  contents: read

jobs:
  resolve-redirects:
    name: Resolve Redirects
    runs-on: ubuntu-22.04
    if: ${{ github.repository == 'yashypsoft/scraper' || !github.event.repository.fork }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests pymysql pandas python-dotenv tqdm

      - name: Run resolve_redirects.py
        env:
          MYSQL_HOST: ${{ secrets.MYSQL_HOST }}
          MYSQL_PORT: ${{ secrets.MYSQL_PORT }}
          MYSQL_USER: ${{ secrets.MYSQL_USER }}
          MYSQL_PASS: ${{ secrets.MYSQL_PASS }}
          MYSQL_DB: ${{ secrets.MYSQL_DB }}
        run: |
          LIMIT_ARG=""
          if [ -n "${{ github.event.inputs.limit }}" ]; then
            LIMIT_ARG="--limit ${{ github.event.inputs.limit }}"
          fi

          python resolve_redirects.py \
            --chunk-size "${{ github.event.inputs.chunk_size || 500 }}" \
            --max-workers "${{ github.event.inputs.max_workers || 15 }}" \
            $LIMIT_ARG
